<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gesture Job Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Source Sans Pro', sans-serif;
      margin: 0;
      padding: 1rem;
      background: #000;
      color: #fff;
    }
	
	#lottieWrapper {
	  display: flex;
	  justify-content: center;
	  align-items: center;
	  margin: 1rem auto;
	  width: 100%;
	}

	#lottieContainer {
	  width: 500px;
	  max-width: 90vw;
	  height: auto;
	}
	
    h1 { text-align: center; }
    .filter-container { margin-bottom: 1rem; text-align: center; }
    .job-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
    }
    .job-card {
      background: #111;
      color: #fff;
      padding: 1rem;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .job-card:hover { transform: scale(1.02); }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .modal.show {
      display: flex;
      opacity: 1;
    }
    .modal-content {
      background: #222;
      color: #fff;
      padding: 2rem;
      border-radius: 10px;
      max-width: 600px;
      width: 90%;
      transform: scale(0.95);
      transition: transform 0.3s ease;
    }
    .modal.show .modal-content {
      transform: scale(1);
    }
    .close {
      float: right;
      font-size: 1.5rem;
      cursor: pointer;
      color: #fff;
    }
    select {
      padding: 0.5rem;
      font-size: 1rem;
      background: #111;
      color: #fff;
      border: 1px solid #555;
    }
    .context-tags {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: #ccc;
    }
  </style>
</head>
<body>
<body>

  <div id="lottieWrapper">
    <div id="lottieContainer"></div>
  </div>



  <h1>Gesture Control: A Job Explorer</h1>
  <div class="filter-container">
    <label for="contextFilter">Filter by Context:</label>
    <select id="contextFilter" onchange="filterJobs()">
      <option value="">All Contexts</option>
    </select>
  </div>
  <div class="job-grid" id="jobGrid"></div>
  <div class="modal" id="jobModal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2 id="modalTitle"></h2>
      <p><strong>Total Employed:</strong> <span id="modalEmployment"></span></p>
      <p id="modalAnalysis"></p>
      <p class="context-tags"><strong>Context Tags:</strong> <span id="modalTags"></span></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
